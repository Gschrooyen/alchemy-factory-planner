name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # "packageManager", the one place the Bun version lives
      - run: bun install --frozen-lockfile
      - run: bun test
      # Without Supabase keys the build is local-only, which is all CI needs to check it compiles
      - run: bun run build
